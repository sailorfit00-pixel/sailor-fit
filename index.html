<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1417">
  <title>Sailor Fit</title>
  <meta name="apple-mobile-web-app-title" content="Sailor Fit">
  <meta name="application-name" content="Sailor Fit">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Colore e nome scelti nel Profilo: si applicano subito, prima che la pagina si disegni (niente lampo di lilla)
    // [chiave, nome, colore, r,g,b, colore scuro (pulsanti pieni)]
    window.COLORI_APP = [
      ["lilla", "Lilla", "#b79cf5", "183,156,245", "#6d5bd0"], ["rosa", "Rosa", "#f29cc4", "242,156,196", "#c24f86"],
      ["pesca", "Pesca", "#f7b07c", "247,176,124", "#c46a2b"], ["corallo", "Corallo", "#f58f86", "245,143,134", "#c4473e"],
      ["giallo", "Giallo", "#f2d067", "242,208,103", "#a88414"], ["menta", "Menta", "#7fdcb0", "127,220,176", "#2f9a6a"],
      ["turchese", "Turchese", "#6fd3d8", "111,211,216", "#22959b"], ["azzurro", "Azzurro", "#8fbaf5", "143,186,245", "#3f72c4"]
    ];
    window.applicaColore = function (chiave) {
      var c = window.COLORI_APP.filter(function (x) { return x[0] === chiave; })[0] || window.COLORI_APP[0], s = document.documentElement.style;
      // tema chiaro: il colore scelto si usa nella versione scura (il lilla chiaro su bianco non si leggerebbe)
      var chiaro = document.documentElement.getAttribute("data-tema") === "chiaro";
      s.setProperty("--lilla", chiaro ? c[4] : c[2]); s.setProperty("--lilla-rgb", c[3]); s.setProperty("--lilla-scuro", c[4]); s.setProperty("--lilla-bg", "rgba(" + c[3] + (chiaro ? ",.18)" : ",.12)"));
      window.applicaIconaHome(c);
    };
    // L'immagine della schermata Home (la figura sulla luna) nel colore scelto: l'iPhone la prende quando fai «Aggiungi alla schermata Home».
    // Si ridipinge solo la figura: lo sfondo scuro resta com'è. Lilla = l'immagine originale.
    window.applicaIconaHome = function (c) {
      var link = document.querySelector('link[rel="apple-touch-icon"]'), fav = document.querySelector('link[rel="icon"]');
      if (!link) return;
      if (c[0] === "lilla") { link.setAttribute("href", "apple-touch-icon.png"); if (fav) { fav.setAttribute("href", "icon.svg"); fav.setAttribute("type", "image/svg+xml"); } return; }
      var img = new Image();
      img.onload = function () {
        try {
          var N = 180, cv = document.createElement("canvas"); cv.width = N; cv.height = N;
          var x = cv.getContext("2d"); x.drawImage(img, 0, 0, N, N);
          var d = x.getImageData(0, 0, N, N), p = d.data;
          var bg = [12, 10, 22], fig = [176, 126, 203], h = c[2].replace("#", "");
          var col = [parseInt(h.substr(0, 2), 16), parseInt(h.substr(2, 2), 16), parseInt(h.substr(4, 2), 16)];
          var lum = function (v) { return 0.299 * v[0] + 0.587 * v[1] + 0.114 * v[2]; }, f = lum(fig) / lum([183, 156, 245]);   // stessa luminosità della figura lilla originale
          var tgt = col.map(function (v) { return v * f; }), dv = [fig[0] - bg[0], fig[1] - bg[1], fig[2] - bg[2]], dd = dv[0] * dv[0] + dv[1] * dv[1] + dv[2] * dv[2];
          for (var i = 0; i < p.length; i += 4) {
            var t = ((p[i] - bg[0]) * dv[0] + (p[i + 1] - bg[1]) * dv[1] + (p[i + 2] - bg[2]) * dv[2]) / dd;   // quanto il punto è «figura» (0 = sfondo, 1 = figura piena, in mezzo = bordo sfumato)
            if (t <= 0.02) continue;
            t = Math.min(1, t);
            for (var k = 0; k < 3; k++) p[i + k] = Math.max(0, Math.min(255, Math.round(p[i + k] + t * (tgt[k] - fig[k]))));
          }
          x.putImageData(d, 0, 0);
          var url = cv.toDataURL("image/png");
          link.setAttribute("href", url);
          if (fav) { fav.setAttribute("href", url); fav.setAttribute("type", "image/png"); }
        } catch (e) {}
      };
      img.src = "icon-512.png";
    };
    // Tema scuro (di base) o chiaro, scelto nel Profilo
    window.applicaTema = function (tema) {
      var chiaro = tema === "chiaro", m = document.querySelector('meta[name="theme-color"]');
      if (chiaro) document.documentElement.setAttribute("data-tema", "chiaro"); else document.documentElement.removeAttribute("data-tema");
      if (m) m.setAttribute("content", chiaro ? "#f3f5f7" : "#0f1417");
    };
    try { var pfT = JSON.parse(localStorage.getItem("mp_profilo") || "{}"); window.applicaTema(pfT.tema); window.applicaColore(pfT.colore || "lilla");
      var mtT = document.querySelector('meta[name="apple-mobile-web-app-title"]'); if (mtT && pfT.nomeApp) mtT.setAttribute("content", pfT.nomeApp);   // il nome sotto l'icona della schermata Home
    } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <h1 id="titolo-app">🌙 Sailor Fit</h1>
    <script>
      // nome e icona dell'app scelti nel Profilo
      try { var pfN = JSON.parse(localStorage.getItem("mp_profilo") || "{}"); if (pfN.nomeApp || pfN.iconaApp) { var tN = (pfN.iconaApp || "🌙") + " " + (pfN.nomeApp || "Sailor Fit"); document.getElementById("titolo-app").textContent = tN; document.title = pfN.nomeApp || "Sailor Fit"; } } catch (e) {}
    </script>
    <p id="saluto" class="saluto" hidden></p>
  </header>

  <main>
    <section id="vista-oggi"><div id="oggi"></div></section>


    <input id="file-csv" type="file" accept=".csv,text/csv" hidden>
    <input id="file-backup" type="file" accept=".json,application/json" hidden>
  </main>

  <nav class="tabbar" aria-label="Sezioni">
    <button id="tab-oggi" data-tab="oggi"><span class="tb-ico">🏠</span><span>Oggi</span></button>
    <button id="tab-settimana" data-tab="settimana"><span class="tb-ico">📅</span><span>Settimana</span></button>
    <button id="tab-detta" class="tab-detta" data-mic="barra" aria-label="Detta: tieni premuto e parla"><span class="detta-ico">🎤</span><span>Detta</span></button>
    <button id="apri-andamento" data-tab="andamento"><span class="tb-ico">📊</span><span>Andamento</span></button>
    <button id="apri-menu" data-tab="altro"><span class="tb-ico">👤</span><span>Profilo</span></button>
  </nav>

  <div id="modal" class="modal" hidden>
    <div class="modal-backdrop" data-chiudi></div>
    <div class="modal-sheet" role="dialog" aria-modal="true">
      <div class="modal-testa"><div class="modal-grip"></div>
        <button class="modal-close" data-chiudi aria-label="Chiudi">✕</button></div>
      <div id="modal-content"></div>
    </div>
  </div>

  <script defer src="sortable.min.js"></script>
  <script defer src="nutrition.js"></script>
  <script defer src="recipes.js"></script>
  <script defer src="app.js"></script>
  <script defer src="libero.js"></script>
  <script defer src="codice-barre.js"></script>
  <script defer src="foto-ricetta.js"></script>
  <script defer src="diario.js"></script>
  <script defer src="benvenuto.js"></script>
  <script defer src="settimana.js"></script>
  <script defer src="andamento.js"></script>
<script defer src="swipe.js"></script>
  <script defer src="voce-profilo.js"></script>
</body>
</html>
