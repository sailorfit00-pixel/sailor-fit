<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1417">
<title>Sailor Fit – Domande</title>
<style>
:root{--bg:#0f1417;--card:#1a2228;--card2:#222d35;--line:#2f3d47;--accent:#35c07d;--text:#e8eef2;--muted:#8ea0ad}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:18px;display:flex;flex-direction:column}
.top{padding:14px 16px 0;display:flex;align-items:center;gap:12px}
#ind{flex:0 0 44px;height:44px;border-radius:12px;background:var(--card2);border:0;color:var(--text);font-size:22px;cursor:pointer}
#ind[hidden]{visibility:hidden;display:block}
.bar{flex:1;height:8px;background:var(--card2);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
main{flex:1;overflow:auto;padding:22px 16px 130px;max-width:560px;width:100%;margin:0 auto}
h1{font-size:27px;line-height:1.2;margin:0 0 20px}
h1 span{display:block;font-size:44px;margin-bottom:8px}
.sc{display:grid;gap:10px}
.sc.due{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.sc.due .b{font-size:17px;padding:12px 10px;gap:8px}
.sc.due .b .e{font-size:24px}
.b>span:last-of-type{min-width:0;overflow-wrap:anywhere}
.b{position:relative;display:flex;align-items:center;gap:10px;min-height:62px;padding:12px 16px;border-radius:16px;background:var(--card2);border:2px solid var(--line);font-size:19px;cursor:pointer;user-select:none;text-align:left;color:var(--text);font-family:inherit}
.b .e{font-size:26px;flex:0 0 auto}
.b.on{background:var(--accent);border-color:var(--accent);color:#06210f;font-weight:700}
.b.on::after{content:"✓";margin-left:auto;font-size:22px}
input[type=text],input[type=number]{width:100%;font-family:inherit;font-size:30px;font-weight:700;padding:16px;border-radius:16px;border:2px solid var(--line);background:var(--card2);color:var(--text);text-align:center}
.u{display:flex;align-items:center;gap:10px}
.u b{font-size:22px;color:var(--muted)}
.altro{margin-top:12px}
.altro input{font-size:18px;font-weight:400;padding:16px;text-align:left}
.foot{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(0deg,var(--bg) 72%,transparent)}
.foot div{max-width:560px;margin:0 auto}
#avanti{width:100%;border:0;border-radius:18px;padding:18px;font-family:inherit;font-size:21px;font-weight:700;background:var(--accent);color:#06210f;cursor:pointer}
#avanti:disabled{background:var(--card2);color:var(--muted)}
#avanti.wa{background:#25d366}
.pic{color:var(--muted);font-size:15px;margin:14px 0 0;text-align:center}
</style>
</head>
<body>
<div class="top"><button id="ind" aria-label="Indietro" hidden>←</button><div class="bar"><i id="pg"></i></div></div>
<main id="m"></main>
<div class="foot"><div><button id="avanti" disabled>Avanti →</button></div></div>

<script>
// ► Numero WhatsApp di chi riceve le risposte (prefisso senza +)
var NUMERO = "393928405915";

// tipo: t=testo, n=numero, u=una scelta, m=più scelte
var Q = [
 {k:"n", t:"t", e:"👋", q:"Come ti chiami?", ph:"Il tuo nome"},
 {k:"s", t:"u", e:"🙋", q:"Sei…", o:[["Donna","👩"],["Uomo","👨"]], due:1},
 {k:"e", t:"n", e:"🎂", q:"Quanti anni hai?", un:"anni", ph:"34"},
 {k:"a", t:"n", e:"📏", q:"Quanto sei alta/o?", un:"cm", ph:"168"},
 {k:"p", t:"n", e:"⚖️", q:"Quanto pesi?", un:"kg", ph:"65", dec:1},
 {k:"ob", t:"m", e:"✨", q:"Qual è il tuo obiettivo?", o:[["Dimagrire","📉"],["Mantenere il peso","⚖️"],["Mettere massa","💪"],["Migliorare le prestazioni","🏆"],["Mangiare meglio","🥗"],["Più energia","⚡"]], req:1, due:1, altro:"oba", altroPh:"Con parole tue (se vuoi)"},
 {k:"po", t:"n", e:"🎯", q:"Che peso vorresti?", un:"kg", ph:"60", dec:1, opz:1, salta:function(a){var o=a.ob||[];return !(o.indexOf("Dimagrire")>-1||o.indexOf("Mettere massa")>-1);}},
 {k:"sp", t:"m", e:"🏃‍♀️", q:"Che sport fai?", o:[["CrossFit","🏋️"],["Sala pesi","💪"],["Allenamento funzionale","🤸‍♀️"],["Corsa","🏃"],["Camminata","🚶"],["Bici","🚴"],["Nuoto","🏊"],["Yoga/Pilates","🧘"],["Padel/Tennis","🎾"],["Ballo","💃"],["Sport di squadra","🏐"],["Nessuno","🛋️"]], excl:"Nessuno", due:1, altro:"spa"},
 {k:"g", t:"u", e:"📅", q:"Quanti giorni a settimana ti alleni?", o:[["0-1","1️⃣"],["2-3","3️⃣"],["4-5","5️⃣"],["6-7","7️⃣"]], due:1, salta:function(a){return (a.sp||[]).indexOf("Nessuno")>-1||!(a.sp||[]).length&&!a.spa;}},
 {k:"oa", t:"u", e:"🕒", q:"A che ora ti alleni di solito?", o:[["Mattina","🌅"],["Pausa pranzo","🍽️"],["Pomeriggio","☀️"],["Sera","🌙"],["Cambia ogni giorno","🔀"]], arr:1, salta:function(a){return (a.sp||[]).indexOf("Nessuno")>-1||!(a.sp||[]).length&&!a.spa;}},
 {k:"l", t:"u", e:"💼", q:"Com'è il tuo lavoro?", o:[["Seduta/o","🪑"],["In piedi/in movimento","🚶"],["Fisico","🧱"]]},
 {k:"pa", t:"m", e:"🍽️", q:"Quali pasti fai ogni giorno?", o:[["Colazione","☕"],["Spuntino mattina","🍎"],["Pranzo","🍝"],["Merenda","🥪"],["Cena","🍲"],["Dopo cena","🍫"]], due:1},
 {k:"c", t:"u", e:"👩‍🍳", q:"E in cucina?", o:[["Poco tempo, cose veloci","⏱️"],["Cucino volentieri","👩‍🍳"],["Preparo tutto in anticipo","🥡"]]},
 {k:"di", t:"u", e:"🥗", q:"Come mangi?", o:[["Mangio di tutto","🍽️"],["Vegetariana","🥕"],["Vegana","🌱"]], arr:1},
 {k:"al", t:"m", e:"⚠️", q:"Hai allergie o intolleranze?", o:[["Nessuna","👍"],["Glutine","🌾"],["Lattosio","🥛"],["Uova","🥚"],["Frutta secca","🥜"],["Pesce","🐟"],["Crostacei/molluschi","🦐"],["Nichel","🔩"],["Soia","🫛"]], excl:"Nessuna", due:1, altro:"ala"},
 {k:"nm", t:"m", e:"🚫", q:"C'è qualcosa che non mangi proprio?", o:[["Niente, mangio tutto","👍"],["Carne rossa","🥩"],["Pollo/tacchino","🍗"],["Maiale/salumi","🥓"],["Pesce","🐟"],["Uova","🥚"],["Latticini","🧀"],["Legumi","🫘"],["Verdure","🥬"],["Frutta","🍓"],["Funghi","🍄"],["Cipolla/aglio","🧅"],["Piccante","🌶️"]], excl:"Niente, mangio tutto", due:1, altro:"nma"},
 {k:"db", t:"m", e:"🍰", q:"Qual è il tuo punto debole?", o:[["Nessuno","👍"],["Dolci","🍰"],["Salato/snack","🍟"],["Pane/pasta","🍞"],["Alcol","🍷"],["Fame nervosa","😮‍💨"],["Salto i pasti","⏭️"]], excl:"Nessuno", due:1},
 {k:"fn", t:"m", e:"📱", q:"Cosa ti servirebbe in un'app?", o:[["Segnare cosa mangio","📝",0],["Settimana già pronta","🗓️",1],["Consigli su cosa mangiare","💡",2],["Calorie che cambiano con lo sport","🏃",3],["Lista della spesa","🛒",8],["Diario del peso","⚖️",10],["Foto di una ricetta","📸",6],["Codice a barre","📷",5]]},
 {k:"u", t:"u", e:"📆", q:"Quanto useresti un'app così?", o:[["Tutti i giorni","📅"],["Qualche volta a settimana","🗓️"],["Solo per i consigli","💡"]]},
 {k:"tel", t:"u", e:"📲", q:"Che telefono hai?", o:[["iPhone","🍎"],["Android","🤖"]], due:1},
 {k:"au", t:"t", e:"📲", q:"Che app usi adesso per mangiare meglio o allenarti?", ph:"Nome, oppure «nessuna»", opz:1, lungo:1},
 {k:"note", t:"t", e:"💬", q:"Nell'app che usi adesso, cosa ti manca?", ph:"Scrivi qui (se vuoi)", opz:1, lungo:1}
];
var A = {};     // risposte
var step = 0;
var m = document.getElementById("m"), btn = document.getElementById("avanti"), ind = document.getElementById("ind");

function salva(){ try{ localStorage.setItem("sf_semplice", JSON.stringify({A:A,step:step})); }catch(x){} }
try{ var s = JSON.parse(localStorage.getItem("sf_semplice")||"null"); if(s){ A=s.A||{}; step=Math.min(s.step||0,Q.length); } }catch(x){}

function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function attiva(q){ return !(q.salta && q.salta(A)); }
function prossimo(da,dir){ var i=da+dir; while(i>=0&&i<Q.length&&!attiva(Q[i])) i+=dir; return i; }

function ok(q){
  var v=A[q.k];
  if(q.opz) return true;
  if(q.req) return (A[q.k]||[]).length>0||!!(q.altro&&A[q.altro]);
  if(q.t==="m") return true;     // si può andare avanti anche senza scegliere
  if(q.t==="u") return v!==undefined&&v!=="";
  return v!==undefined&&String(v).trim()!=="";
}

function render(){
  var tot=Q.filter(attiva).length, fatti=Q.slice(0,step).filter(attiva).length;
  document.getElementById("pg").style.width=Math.round(fatti/tot*100)+"%";
  ind.hidden = step===0;
  if(step>=Q.length){ fine(); return; }
  var q=Q[step], v=A[q.k], h='<h1><span>'+q.e+'</span>'+esc(q.q)+'</h1>';
  if(q.t==="t"||q.t==="n"){
    if(q.t==="n") h+='<div class="u"><input id="inp" type="number" inputmode="'+(q.dec?"decimal":"numeric")+'" placeholder="'+(q.ph||"")+'" value="'+(v||"")+'"><b>'+q.un+'</b></div>';
    else if(q.lungo) h+='<input id="inp" type="text" placeholder="'+(q.ph||"")+'" value="'+esc(v||"")+'">';
    else h+='<input id="inp" type="text" autocomplete="given-name" placeholder="'+(q.ph||"")+'" value="'+esc(v||"")+'">';
    if(q.opz) h+='<p class="pic">Puoi saltare</p>';
  } else {
    var sel = q.t==="m" ? (A[q.k]||[]) : (q.arr ? (A[q.k]||[]) : (v?[v]:[]));
    h+='<div class="sc'+(q.due?" due":"")+'">'+q.o.map(function(o,i){
      return '<button type="button" class="b'+(sel.indexOf(o[0])>-1?" on":"")+'" data-i="'+i+'"><span class="e">'+o[1]+'</span><span>'+esc(o[0])+'</span></button>'; }).join("")+'</div>';
    if(q.altro) h+='<div class="altro"><input id="alt" type="text" placeholder="'+esc(q.altroPh||"Altro? Scrivi qui")+'" value="'+esc(A[q.altro]||"")+'"></div>';
    if(q.t==="m") h+='<p class="pic">Puoi toccarne più di uno</p>';
  }
  m.innerHTML=h; window.scrollTo(0,0); m.scrollTop=0;
  aggiornaBtn();
  var i=document.getElementById("inp"); if(i&&!v&&step<2){ setTimeout(function(){try{i.focus();}catch(x){}},150); }
}
function aggiornaBtn(){
  var q=Q[step]; if(!q) return;
  btn.disabled=!ok(q);
  btn.textContent = (q.opz&&!A[q.k]) ? "Salta →" : "Avanti →";
}

m.addEventListener("input", function(e){
  var q=Q[step];
  if(e.target.id==="inp"){ A[q.k]=e.target.value; aggiornaBtn(); salva(); }
  if(e.target.id==="alt"){ A[q.altro]=e.target.value.trim(); aggiornaBtn(); salva(); }
});
m.addEventListener("click", function(e){
  var b=e.target.closest(".b"); if(!b) return;
  var q=Q[step], o=q.o[+b.dataset.i], val=o[0];
  if(q.t==="u"){
    A[q.k]= q.arr ? [val] : val;
    salva(); render();
    setTimeout(avanti,220);                    // una sola scelta: si va avanti da soli
    return;
  }
  // più scelte
  var cur=(A[q.k]||[]).slice(), p=cur.indexOf(val);
  if(q.k==="fn"){ if(p>-1) cur.splice(p,1); else cur.push(val); }
  else if(val===q.excl){ cur = p>-1?[]:[val]; }
  else { cur=cur.filter(function(x){return x!==q.excl;}); if(p>-1) cur.splice(cur.indexOf(val),1); else cur.push(val); }
  A[q.k]=cur; salva(); b.classList.toggle("on"); if(val===q.excl||p===-1) render(); aggiornaBtn();
});

function avanti(){
  if(step>=Q.length) return;
  var q=Q[step]; if(!ok(q)) return;
  step=prossimo(step,1); if(step>=Q.length) step=Q.length;
  salva(); render();
}
function indietro(){ var i=prossimo(step,-1); if(i>=0){ step=i; salva(); render(); } }
ind.addEventListener("click", indietro);

function dati(){
  var fn=[]; for(var i=0;i<13;i++) fn.push("-");
  (A.fn||[]).forEach(function(nome){ Q.filter(function(q){return q.k==="fn";})[0].o.forEach(function(o){ if(o[0]===nome) fn[o[2]]="s"; }); });
  var nm=(A.nm||[]).filter(function(x){return x!=="Niente, mangio tutto";});
  return {n:A.n||"",s:A.s||"",e:A.e||"",a:A.a||"",p:A.p||"",po:A.po||"",ob:A.ob||[],oba:A.oba||"",t:"",sp:A.sp||[],spa:A.spa||"",g:A.g||"",oa:A.oa||[],l:A.l||"",pa:A.pa||[],dv:[],c:A.c||"",
    di:A.di||[],al:A.al||[],ala:A.ala||"",nm:nm,nma:A.nma||"",db:(A.db||[]).filter(function(x){return x!=="Nessuno";}),u:A.u||"",tel:A.tel||"",rg:[],note:A.note||"",au:A.au||"",fn:fn.join("")};
}
function link(){
  var b=btoa(unescape(encodeURIComponent(JSON.stringify(dati())))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
  return location.href.replace(/[#?].*$/,"").replace(/[^\/]*$/,"")+"risposte.html#"+b;
}
function messaggio(){
  var d=dati(), L=[];
  L.push("🌙 *SAILOR FIT* – risposte di *"+(d.n||"?")+"*");
  L.push((d.s||"")+" · "+(d.e||"?")+" anni · "+(d.a||"?")+" cm · "+(d.p||"?")+" kg"+(d.po?" → "+d.po+" kg":""));
  L.push("🎯 "+((d.ob.concat(d.oba?[d.oba]:[])).join(", ")||"—"));
  L.push("🏃 "+((d.sp.concat(d.spa?[d.spa]:[])).join(", ")||"—")+(d.g?" · "+d.g+" gg/sett":"")+((d.oa||[]).length?" · "+d.oa.join(", "):""));
  L.push("🥗 "+(d.di.join(", ")||"—")+" · ⚠️ "+((d.al.concat(d.ala?[d.ala]:[])).join(", ")||"nessuna"));
  L.push("🚫 "+((d.nm.concat(d.nma?[d.nma]:[])).join(", ")||"niente"));
  if(d.au) L.push("📲 App che usa adesso: "+d.au);
  if(d.note) L.push("💬 Cosa gli manca: "+d.note);
  L.push(""); L.push("🔎 Scheda:"); L.push(link());
  return L.join("\n");
}

function fine(){
  document.getElementById("pg").style.width="100%";
  m.innerHTML='<h1><span>🎉</span>Fatto, grazie!</h1><div class="sc"><p style="margin:0;color:var(--muted)">Ultimo passo: manda le risposte 👇</p></div>';
  btn.disabled=false; btn.className="wa"; btn.textContent="✅ Invia le risposte";
}
btn.addEventListener("click", function(){
  if(step>=Q.length){ window.location.href="https://wa.me/"+NUMERO+"?text="+encodeURIComponent(messaggio()); return; }
  avanti();
});
// Invio sulla tastiera = Avanti
document.addEventListener("keydown", function(e){ if(e.key==="Enter"&&step<Q.length&&e.target.tagName==="INPUT"&&e.target.id!=="alt") { e.preventDefault(); avanti(); } });

render();
</script>
</body>
</html>
